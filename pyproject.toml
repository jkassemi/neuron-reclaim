[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesplice"
version = "0.3.0"
description = "Zero-corpus, zero-gradient weight surgery for local LLMs: Surgical Concept Grafting (SCG), SwiGLU/MoE neuron atlas, transactional editing TUI, and Stein's-lemma GGUF behavioral folding."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "James Kassemi", email = "james@kassemi.org" }]
requires-python = ">=3.12"
keywords = [
    "vibesplice",
    "surgical-concept-grafting",
    "weight-space-programming",
    "mechanistic-interpretability",
    "model-editing",
    "llm",
    "moe",
    "gguf",
    "safetensors",
    "pytorch",
    "tui",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "rich>=13.7",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.45",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jkassemi/vibesplice"
Repository = "https://github.com/jkassemi/vibesplice"
Paper = "https://www.alphaxiv.org/abs/2611.zero-gradient-surgical-concept-grafting"

[project.scripts]
vibesplice = "cli:app"
neuron-reclaim = "cli:app"

[tool.setuptools]
py-modules = [
    "backend",
    "cli",
    "cluster",
    "gguf_fold",
    "graft",
    "models",
    "session",
    "surgery",
    "tui",
    "weights",
]
