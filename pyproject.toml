[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesplice"
version = "0.4.1"
description = "Zero-corpus, zero-gradient weight surgery for local LLMs: Surgical Concept Grafting (SCG) with joint anti-bleed scaling (K=100), transactional slot rollback, weight-space stealth auditing, SwiGLU/MoE atlas TUI, and Stein's-lemma GGUF folding."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "James Kassemi", email = "james@kassemi.org" }]
requires-python = ">=3.12"
keywords = [
    "vibesplice",
    "surgical-concept-grafting",
    "weight-space-programming",
    "mechanistic-interpretability",
    "model-editing",
    "llm",
    "moe",
    "gguf",
    "safetensors",
    "pytorch",
    "tui",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "rich>=13.7",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.45",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jkassemi/vibesplice"
Repository = "https://github.com/jkassemi/vibesplice"
Paper = "https://www.alphaxiv.org/abs/2611.zero-gradient-surgical-concept-grafting"
DOI = "https://doi.org/10.5281/zenodo.24522314"

[project.scripts]
vibesplice = "cli:app"
neuron-reclaim = "cli:app"

[tool.setuptools]
py-modules = [
    "audit_gguf",
    "backend",
    "cli",
    "cluster",
    "gguf_fold",
    "graft",
    "latch",
    "ledger",
    "models",
    "session",
    "surgery",
    "tui",
    "weights",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
